<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">PDF Studio</title><desc id="d">A PDF page is annotated and exported in a local workspace.</desc><defs><linearGradient id="bg"><stop stop-color="#1b263d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="170" y="55" width="190" height="205" rx="10" fill="#e7edf5"/><rect x="200" y="90" width="130" height="9" rx="4" fill="#8b9bb0"/><rect x="200" y="115" width="130" height="9" rx="4" fill="#8b9bb0"/><rect x="200" y="140" width="100" height="9" rx="4" fill="#8b9bb0"/><path d="M205 185Q255 150 310 205" fill="none" stroke="#4d9f91" stroke-width="6" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 200;200 0" dur="3s" repeatCount="indefinite"/></path><path d="M420 155H650" stroke="#62e3c1" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><rect x="700" y="80" width="300" height="145" rx="14" fill="#102b30" stroke="#62e3c1" stroke-width="2"/><g fill="#edf3ff" font-family="monospace" font-size="16"><text x="740" y="130">ANNOTATE</text><text x="740" y="165">DRAW / MARKUP</text><text x="740" y="200">EXPORT PDF</text></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">PDF STUDIO</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">VIEW / ANNOTATE / EXPORT</text></svg>